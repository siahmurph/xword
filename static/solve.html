<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solving — The Crossword Shelf</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="topbar">
  <div>
    <h1 id="puzTitleTop">Loading…</h1>
    <div class="sub">solving together</div>
  </div>
  <nav>
    <a href="/">← Shelf</a>
  </nav>
</div>

<div class="container">
  <div class="solve-wrap">
    <div class="grid-panel">
      <div id="grid"></div>
      <div class="status-bar">
        <span><span class="status-dot" id="connDot">●</span> <span id="connText">connecting…</span></span>
        <span>
          <button class="btn small" id="checkBtn">Check letter</button>
          <button class="btn small" id="resetBtn">Clear grid</button>
        </span>
      </div>
    </div>
    <div class="clues-panel">
      <h3>Across</h3>
      <ul class="clue-list" id="acrossList"></ul>
      <h3>Down</h3>
      <ul class="clue-list" id="downList"></ul>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const puzzleId = params.get('id');
let puzzle = null;
let direction = 'across'; // or 'down'
let activeCell = 0;
let ws = null;

async function load() {
  const res = await fetch(`/api/puzzles/${puzzleId}`);
  if (!res.ok) { document.getElementById('puzTitleTop').textContent = 'Puzzle not found'; return; }
  puzzle = await res.json();
  document.getElementById('puzTitleTop').textContent = puzzle.title || 'Untitled';
  sizeGridToFit();
  buildGrid();
  buildClueLists();
  connectWs();
  const firstWhite = puzzle.black.includes(0) ? findNextWhite(0, 1) : 0;
  setActive(firstWhite);
}

// Picks a cell size that makes the whole grid fit within its panel — no
// horizontal scrollbar even for a wide 21x21 grid — while staying within a
// comfortable tap-target range. Re-run on resize/orientation change since
// the panel's available width changes (e.g. rotating an iPad).
const MIN_CELL = 24, MAX_CELL = 44, GRID_GAP = 1, GRID_BORDER = 2, SAFETY_MARGIN = 6;
function sizeGridToFit() {
  if (!puzzle) return;
  const panel = document.querySelector('.grid-panel');
  const style = getComputedStyle(panel);
  const hPad = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
  const available = panel.clientWidth - hPad - GRID_BORDER * 2 - (puzzle.width - 1) * GRID_GAP - SAFETY_MARGIN;
  const size = Math.max(MIN_CELL, Math.min(MAX_CELL, Math.floor(available / puzzle.width)));
  document.getElementById('grid').style.setProperty('--cell-size', size + 'px');
}

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { sizeGridToFit(); }, 120);
});

function idx(r, c) { return r * puzzle.width + c; }

function buildGrid() {
  const grid = document.getElementById('grid');
  grid.style.gridTemplateColumns = `repeat(${puzzle.width}, var(--cell-size, 36px))`;
  grid.innerHTML = '';
  for (let r = 0; r < puzzle.height; r++) {
    for (let c = 0; c < puzzle.width; c++) {
      const i = idx(r, c);
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.i = i;
      if (puzzle.black.includes(i)) {
        cell.classList.add('black');
      } else {
        if (puzzle.numbering[i]) {
          const num = document.createElement('span');
          num.className = 'num';
          num.textContent = puzzle.numbering[i];
          cell.appendChild(num);
        }
        const input = document.createElement('input');
        input.maxLength = 1;
        input.autocapitalize = 'characters';
        input.autocomplete = 'off';
        input.setAttribute('autocorrect', 'off');
        input.spellcheck = false;
        input.inputMode = 'text';
        input.dataset.i = i;
        input.value = puzzle.fill[i] || '';
        input.addEventListener('focus', () => setActive(i));
        input.addEventListener('dblclick', (e) => { e.preventDefault(); toggleDirection(i); });
        input.addEventListener('keydown', (e) => onKeyDown(e, i));
        input.addEventListener('beforeinput', (e) => onBeforeInput(e, i));
        input.addEventListener('input', (e) => onInput(e, i));
        cell.appendChild(input);
      }
      grid.appendChild(cell);
    }
  }
}

function buildClueLists() {
  const acrossList = document.getElementById('acrossList');
  const downList = document.getElementById('downList');
  acrossList.innerHTML = '';
  downList.innerHTML = '';
  for (const cl of puzzle.clues.across) {
    const li = document.createElement('li');
    li.dataset.cell = cl.cell;
    li.dataset.dir = 'across';
    li.innerHTML = `<b>${cl.num}</b>${escapeHtml(cl.clue || '(no clue text)')}`;
    li.addEventListener('click', () => { direction = 'across'; setActive(cl.cell); });
    acrossList.appendChild(li);
  }
  for (const cl of puzzle.clues.down) {
    const li = document.createElement('li');
    li.dataset.cell = cl.cell;
    li.dataset.dir = 'down';
    li.innerHTML = `<b>${cl.num}</b>${escapeHtml(cl.clue || '(no clue text)')}`;
    li.addEventListener('click', () => { direction = 'down'; setActive(cl.cell); });
    downList.appendChild(li);
  }
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function wordBounds(cellIdx, dir) {
  const r = Math.floor(cellIdx / puzzle.width), c = cellIdx % puzzle.width;
  let start = cellIdx, end = cellIdx;
  if (dir === 'across') {
    let cc = c;
    while (cc > 0 && !puzzle.black.includes(idx(r, cc - 1))) cc--;
    start = idx(r, cc);
    cc = c;
    while (cc < puzzle.width - 1 && !puzzle.black.includes(idx(r, cc + 1))) cc++;
    end = idx(r, cc);
    return { cells: range(start, end, 1) };
  } else {
    let rr = r;
    while (rr > 0 && !puzzle.black.includes(idx(rr - 1, c))) rr--;
    start = idx(rr, c);
    rr = r;
    while (rr < puzzle.height - 1 && !puzzle.black.includes(idx(rr + 1, c))) rr++;
    end = idx(rr, c);
    return { cells: range(start, end, puzzle.width) };
  }
}

function range(start, end, step) {
  const out = [];
  for (let i = start; i <= end; i += step) out.push(i);
  return out;
}

// Direction is "master" state: it only ever changes via toggleDirection()
// (double-tap/double-click the active cell), an explicit clue click, or an
// arrow key press. Merely tapping a different cell — including refocusing
// via the browser's own tab/click handling — must NOT change it, so that
// staying in "across" keeps every subsequent tap/type in the across realm.
// The one forced exception: if the current direction has no multi-cell word
// at the tapped cell at all (an isolated square), fall back to whichever
// direction actually has a word there.
function setActive(cellIdx) {
  if (puzzle.black.includes(cellIdx)) return;
  activeCell = cellIdx;

  if (wordBounds(activeCell, direction).cells.length < 2) {
    const alt = direction === 'across' ? 'down' : 'across';
    if (wordBounds(activeCell, alt).cells.length >= 2) direction = alt;
  }

  document.querySelectorAll('.cell').forEach(c => c.classList.remove('active', 'word-highlight'));
  document.querySelectorAll('.clue-list li').forEach(li => li.classList.remove('active-clue'));

  const bounds = wordBounds(activeCell, direction);
  bounds.cells.forEach(i => {
    const el = document.querySelector(`.cell[data-i="${i}"]`);
    if (el) el.classList.add('word-highlight');
  });
  const activeEl = document.querySelector(`.cell[data-i="${activeCell}"]`);
  if (activeEl) activeEl.classList.add('active');
  const input = document.querySelector(`input[data-i="${activeCell}"]`);
  if (input && document.activeElement !== input) input.focus();

  const li = document.querySelector(`.clue-list li[data-cell="${bounds.cells[0]}"][data-dir="${direction}"]`);
  if (li) { li.classList.add('active-clue'); li.scrollIntoView({ block: 'nearest' }); }
}

function toggleDirection(cellIdx) {
  const alt = direction === 'across' ? 'down' : 'across';
  if (wordBounds(cellIdx, alt).cells.length >= 2) direction = alt;
  setActive(cellIdx);
}

function findNextWhite(from, step) {
  let i = from;
  while (puzzle.black.includes(i) && i < puzzle.width * puzzle.height) i += step;
  return i;
}

// Backspace-on-an-already-empty-cell ("chain delete back through the word")
// is detected from two different events because iPadOS versions vary on
// which they actually fire from the on-screen keyboard: `beforeinput`
// (modern, most reliable) and `keydown` (older/some versions). The
// `backspaceHandled` guard stops both from firing the same physical
// keypress twice on devices where both events show up.
//
// The actual cell-jump is deferred with setTimeout(..., 0) rather than run
// synchronously inside the event handler: changing focus to a different
// <input> from inside the keyboard's own edit event can desync which field
// the on-screen keyboard thinks it's typing into on iPadOS, which is what
// made chain-delete stop after one hop (had to tap each cell manually
// after the first backspace). Letting the current event finish first
// avoids that.
let backspaceHandled = false;
function handleEmptyBackspace(i) {
  if (backspaceHandled) return;
  backspaceHandled = true;
  // Reset in the same deferred tick that performs the move: this only
  // needs to dedupe keydown+beforeinput firing for the *same* physical
  // keypress (which land in the same task, back to back), not throttle
  // separate keypresses — a longer window would eat legitimate rapid
  // repeated backspaces.
  setTimeout(() => { backspaceHandled = false; movePrev(i, true); }, 0);
}

function onBeforeInput(e, i) {
  if (e.inputType === 'deleteContentBackward' && !e.target.value) {
    e.preventDefault();
    handleEmptyBackspace(i);
  }
}

function onInput(e, i) {
  let val = e.target.value.toUpperCase().replace(/[^A-Z]/g, '');
  e.target.value = val.slice(-1);
  puzzle.fill[i] = e.target.value;
  sendFill(i, e.target.value);
  if (e.target.value) moveNext(i);
}

function onKeyDown(e, i) {
  if (e.key === 'Backspace' && !e.target.value) {
    e.preventDefault();
    handleEmptyBackspace(i);
  }
  // Arrow-key navigation only matters for hardware/Bluetooth keyboards —
  // iPad's on-screen keyboard has no arrow keys — but an explicit arrow
  // press is a deliberate directional choice, so it's allowed to set the
  // master direction (same as clicking a clue).
  else if (e.key === 'ArrowRight') { e.preventDefault(); direction = 'across'; setActive(idx(Math.floor(i / puzzle.width), (i % puzzle.width) + 1)); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); direction = 'across'; setActive(idx(Math.floor(i / puzzle.width), (i % puzzle.width) - 1)); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); direction = 'down'; setActive(i + puzzle.width); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); direction = 'down'; setActive(i - puzzle.width); }
}

function moveNext(i) {
  const { cells } = wordBounds(i, direction);
  const pos = cells.indexOf(i);
  if (pos >= 0 && pos < cells.length - 1) setActive(cells[pos + 1]);
}

function movePrev(i, clearIt) {
  const { cells } = wordBounds(i, direction);
  const pos = cells.indexOf(i);
  if (pos > 0) {
    const prevCell = cells[pos - 1];
    setActive(prevCell);
    if (clearIt) {
      const input = document.querySelector(`input[data-i="${prevCell}"]`);
      if (input) { input.value = ''; puzzle.fill[prevCell] = ''; sendFill(prevCell, ''); }
    }
  }
}

function sendFill(cell, letter) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'fill', cell, letter }));
  }
}

function connectWs() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/${puzzleId}`);
  ws.onopen = () => { setConn(true); };
  ws.onclose = () => { setConn(false); setTimeout(connectWs, 2000); };
  ws.onerror = () => setConn(false);
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'fill') {
      puzzle.fill[msg.cell] = msg.letter;
      const input = document.querySelector(`input[data-i="${msg.cell}"]`);
      if (input && document.activeElement !== input) {
        input.value = msg.letter;
        input.classList.add('other-fill');
        setTimeout(() => input.classList.remove('other-fill'), 900);
      }
    }
  };
}

function setConn(ok) {
  document.getElementById('connDot').style.color = ok ? 'var(--pen)' : 'var(--pencil-red)';
  document.getElementById('connText').textContent = ok ? 'live' : 'reconnecting…';
}

document.getElementById('checkBtn').addEventListener('click', () => {
  if (!puzzle.has_solution) { alert('This puzzle has no answer key saved.'); return; }
  const input = document.querySelector(`input[data-i="${activeCell}"]`);
  if (!input) return;
  const correct = puzzle.solution[activeCell];
  if (!correct) { alert('No answer stored for this square.'); return; }
  if ((input.value || '').toUpperCase() === correct.toUpperCase()) {
    input.style.background = '#dff0d8';
  } else {
    input.style.background = '#f6d7d7';
  }
  setTimeout(() => { input.style.background = ''; }, 900);
});

document.getElementById('resetBtn').addEventListener('click', async () => {
  if (!confirm('Clear the whole grid for both players?')) return;
  await fetch(`/api/puzzles/${puzzleId}/reset`, { method: 'POST' });
  location.reload();
});

load();
</script>
</body>
</html>
